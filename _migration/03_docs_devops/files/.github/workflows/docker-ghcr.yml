# Сборка образа на GitHub Actions (больше диска, чем у shared Railway Metal builder)
# и публикация в GHCR. Обход при ошибке BuildKit: «no space left on device» на Railway.
#
# Настройка Railway: создать/переключить сервис на источник «Docker image» и указать, например:
#   ghcr.io/<владелец>/<репозиторий>:latest
# (имя пакета в GHCR совпадает с репозиторием в нижнем регистре.)
#
# Первый пуш: в GitHub → Packages → пакет → Package settings → Change visibility (public или оставить private и добавить PAT в Railway).

name: Build and push Docker image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (lowercase image name for GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
